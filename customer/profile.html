<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile - Simple E‑Commerce</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
    <header>
        <nav id="navbar"></nav>
    </header>
    <main class="container" id="profilePage">
        <h1>My Profile</h1>
        <form id="profileForm">
            <label for="name">Name:</label><br />
            <input type="text" id="name" required /><br />
            <label for="email">Email (read‑only):</label><br />
            <input type="email" id="email" disabled /><br />
            <label for="phone">Phone:</label><br />
            <input type="tel" id="phone" /><br />
            <label for="address">Delivery Address:</label><br />
            <textarea id="address" rows="3"></textarea><br />
            <button type="submit" class="btn">Save Changes</button>
        </form>
    </main>
    <footer class="footer"><p>&copy; 2026 Simple E‑Commerce</p></footer>
    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="profile.js"></script>
</body>
</html>
