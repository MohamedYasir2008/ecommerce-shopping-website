<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Product - Simple E‑Commerce</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
    <header>
        <nav id="navbar"></nav>
    </header>
    <main class="container" id="addProductPage">
        <h1>Add New Product</h1>
        <form id="addProductForm">
            <label for="name">Product Name:</label><br />
            <input type="text" id="name" required /><br />
            <label for="description">Description:</label><br />
            <textarea id="description" rows="3" required></textarea><br />
            <label for="category">Category:</label><br />
            <select id="category" required></select><br />
            <label for="price">Price (₹):</label><br />
            <input type="number" id="price" min="0" step="0.01" required /><br />
            <label for="stock">Stock Quantity:</label><br />
            <input type="number" id="stock" min="0" required /><br />
            <label for="image">Image URL:</label><br />
            <input type="url" id="image" placeholder="https://example.com/image.jpg" required /><br /><br />
            <button type="submit" class="btn">Add Product</button>
        </form>
        <div id="msg" style="margin-top:1rem;"></div>
    </main>
    <footer class="footer"><p>&copy; 2026 Simple E‑Commerce</p></footer>
    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="add-product.js"></script>
</body>
</html>
